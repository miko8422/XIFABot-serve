[project]
name = "xifabot-serve"
version = "0.2.0"
description = "A read-only bridge: services on your Windows PC, answered on request, served to agents on your Mac over MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "uvicorn>=0.40.0",
    # only the Windows device side captures and encodes images
    "mss>=10.2.0 ; sys_platform == 'win32'",
    "pillow>=12.0.0 ; sys_platform == 'win32'",
]

[project.scripts]
xifabot-serve = "xifabot_serve:main"

[dependency-groups]
dev = ["pillow>=12.0.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
